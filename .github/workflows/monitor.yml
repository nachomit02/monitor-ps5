name: Monitor de PS5

on:
  schedule:
    - cron: "47 * * * *"   # cada hora, en el minuto 47 (el de las teles corre en el 17)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write            # para guardar state.json, historial.csv y salud.json entre corridas

concurrency:
  group: monitor-ps5
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Armar secrets.json desde los secretos de GitHub
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_SECRET: ${{ secrets.ML_SECRET }}
        run: |
          python - <<'EOF'
          import json, os
          json.dump({"token": os.environ["TELEGRAM_TOKEN"], "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                     "ml_client_id": os.environ["ML_CLIENT_ID"], "ml_secret": os.environ["ML_SECRET"]},
                    open("secrets.json", "w"))
          EOF

      - name: Revisar tiendas
        run: python monitor.py

      - name: Avisar si el monitor se rompe o el token vence
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULTADO: ${{ job.status }}
        run: python nube.py aviso-corrida

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          for f in state.json historial.csv salud.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "estado $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q || true
          git push
